<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Premier MOT & Service</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="login-page">

<div class="login-bg-grid"></div>

<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon">
      <i class="fas fa-car-burst"></i>
    </div>
    <h1>Premier MOT & Service</h1>
    <p>Staff Administration Portal</p>
  </div>

  <h2 class="login-title">Welcome Back</h2>
  <p class="login-sub">Sign in to access the CRM dashboard.</p>

  <div class="login-error" id="loginError">
    <i class="fas fa-exclamation-circle"></i>
    <span>Incorrect username or password. Please try again.</span>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
    </div>
    <button type="submit" class="btn-login">
      <i class="fas fa-arrow-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div class="login-footer">
    <a href="index.html" style="color:var(--text-dim);transition:color 0.2s">
      <i class="fas fa-arrow-left"></i> Back to public website
    </a>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/auth.js"></script>
</body>
</html>
